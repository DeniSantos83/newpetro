<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - HELPDESK</title>
<!-- Favicon -->
  <link rel="icon" href="../img/favicon.jpg" type="image/png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="SAGIP/CSS/style.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100"
      style="background: url('img/help.jpg') center/cover no-repeat fixed;">
<div class="card login-card shadow-lg p-4" style="max-width: 400px; width: 100%; border-radius: 1rem;">
<div class="text-center mb-4">
<img src="img/LOGOPETRONEW-transp.png" alt="Petroeng" class="mb-3" style="width: 180px;">

<h4 class="fw-bold text-primary">SUPORTE TI / HELP DESK</h4>

<p class="text-muted small">Use seu e-mail corporativo para entrar.</p>

</div>


<form id="loginForm">
<div class="mb-3">
<label for="email" class="form-label">E-mail</label>
<input type="email" id="email" class="form-control" required>
</div>
<div class="mb-3">
<label for="password" class="form-label">Senha</label>
<input type="password" id="password" class="form-control" required>
</div>
<button type="submit" class="btn btn-primary w-100">Entrar</button>
</form>


<div class="text-center mt-3">
<a href="../index.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Voltar ao Site</a>
</div>
</div>


<script src="js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
